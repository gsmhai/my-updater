name: Update Subscription Content

on:
  schedule:
    # 每天北京时间 0:00, 6:00, 12:00, 18:00 执行一次 (UTC 时间比北京慢 8 小时)
    #- cron: '0 4,10,16,22 * * *'
    - cron: '*/15 * * * *'
  workflow_dispatch: # 允许你在 GitHub 页面手动点击运行

permissions:
  contents: write

# 防止多个运行同时执行、互相 force-push 覆盖
concurrency:
  group: update-subscription
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install requests pyyaml

      - name: Run Update Script
        run: python auto_proxy.py

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .

          # 检查是否有实际的文件变动，如果没有就直接退出，不执行无意义的提交
          if git diff-index --quiet HEAD; then
            echo "没有发现文件变动，跳过本次提交。"
            exit 0
          fi

          # 定义我们的自动更新专属签名
          AUTO_COMMIT_MSG="⚡ Auto update: 节点与历史更新频率已同步"

          # 获取上一次提交的备注信息和作者（双重校验，防止误 amend 人工提交）
          LAST_COMMIT_MSG=$(git log -1 --pretty=format:"%s")
          LAST_AUTHOR_EMAIL=$(git log -1 --pretty=format:"%ae")

          # 判断逻辑：备注和作者都匹配才认定为我们的自动更新
          if [ "$LAST_COMMIT_MSG" = "$AUTO_COMMIT_MSG" ] && [ "$LAST_AUTHOR_EMAIL" = "github-actions[bot]@users.noreply.github.com" ]; then
            echo "检测到上一次是自动更新，执行追加合并 (amend)..."
            git commit --amend --no-edit
            # --force-with-lease：如果 checkout 之后远端出现了新提交（比如你的人工 push），
            # 推送会被拒绝，而不是像 --force 那样直接覆盖掉
            if ! git push --force-with-lease origin main; then
              echo "⚠️ 推送被拒：远端在本次运行期间出现了新提交（可能是人工提交）。"
              echo "本次放弃推送以保护该提交，下一次定时运行会基于最新代码重新生成。"
              exit 0
            fi
          else
            echo "检测到上一次是人工修改: $LAST_COMMIT_MSG"
            echo "执行新建提交，保护人工修改记录..."
            git commit -m "$AUTO_COMMIT_MSG"
            if ! git push origin main; then
              echo "⚠️ 推送被拒：远端有新提交。本次放弃，下一次定时运行会重新生成。"
              exit 0
            fi
          fi
