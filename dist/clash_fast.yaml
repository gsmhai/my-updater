  - +.stun.*.*.*.*
  - stun.*.*
  - stun.l.google.com
  - localhost.ptlogin2.qq.com
  - localhost.sec.qq.com
  - +.srv.nintendo.net
  - +.stun.playstation.net
  - xbox.*.*.microsoft.com
  - +.xboxlive.com
  - +.battlenet.com.cn
  default-nameserver:
  - 223.5.5.5
  - 119.29.29.29
